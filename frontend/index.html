<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Flow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1>Task Flow</h1>
      <div id="user-bar" class="user-bar" hidden>
        <span id="current-user" class="current-user"></span>
        <button type="button" id="logout-button" class="secondary">로그아웃</button>
      </div>
    </header>
    <p id="boot-message" class="boot-message" role="status">로그인 상태를 확인하는 중입니다.</p>

    <section id="auth-view" class="auth-card" aria-label="로그인과 회원가입" hidden>
      <div class="tabs" role="tablist" aria-label="로그인과 회원가입">
        <button type="button" role="tab" id="tab-login" class="tab" aria-selected="true" aria-controls="panel-login">로그인</button>
        <button type="button" role="tab" id="tab-signup" class="tab" aria-selected="false" aria-controls="panel-signup" tabindex="-1">회원가입</button>
      </div>
      <p id="auth-message" class="auth-message" role="alert" hidden></p>
      <div id="panel-login" role="tabpanel" aria-labelledby="tab-login">
        <form id="login-form" class="auth-form" novalidate>
          <label>아이디
            <input id="login-username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="20">
          </label>
          <label>비밀번호
            <input id="login-password" type="password" autocomplete="current-password" maxlength="20">
          </label>
          <button type="submit" class="primary">로그인</button>
        </form>
      </div>
      <div id="panel-signup" role="tabpanel" aria-labelledby="tab-signup" hidden>
        <form id="signup-form" class="auth-form" novalidate>
          <label>아이디
            <input id="signup-username" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="20" aria-describedby="signup-username-hint">
            <small id="signup-username-hint">영문·숫자·밑줄(_) 3~20자</small>
          </label>
          <label>비밀번호
            <input id="signup-password" type="password" autocomplete="new-password" maxlength="20" aria-describedby="signup-password-hint">
            <small id="signup-password-hint">8~20자</small>
          </label>
          <label>비밀번호 확인
            <input id="signup-password-confirm" type="password" autocomplete="new-password" maxlength="20">
          </label>
          <button type="submit" class="primary">가입하기</button>
        </form>
      </div>
    </section>

    <div id="app-view" hidden>
    <p id="error-message" class="error" role="alert" hidden></p>
    <div class="layout">
      <aside class="panel form-panel" id="form-panel">
        <div class="panel-header">
          <h2>새 할 일</h2>
          <button type="button" id="form-toggle" class="panel-toggle" aria-expanded="true" aria-controls="form-body" aria-label="등록 폼 접기">
            <span id="form-toggle-label" aria-hidden="true">−</span>
          </button>
        </div>
        <div class="panel-body" id="form-body">
          <div class="panel-body-inner">
            <div class="panel-content">
              <form id="task-form" novalidate>
                <div class="form-row">
                  <label for="title-input" class="visually-hidden">제목</label>
                  <input id="title-input" type="text" placeholder="할 일 제목 (1~100자)" autocomplete="off">
                  <button type="submit">등록</button>
                </div>
                <label for="description-input" class="visually-hidden">설명</label>
                <textarea id="description-input" rows="2" placeholder="설명 (선택, 최대 2000자)"></textarea>
                <div class="form-row options">
                  <label>우선순위
                    <select id="priority-input">
                      <option value="HIGH">높음</option>
                      <option value="NORMAL" selected>보통</option>
                      <option value="LOW">낮음</option>
                    </select>
                  </label>
                  <label>마감일
                    <input id="due-input" type="date">
                  </label>
                </div>
              </form>
            </div>
          </div>
        </div>
      </aside>
      <section class="panel list-panel" id="list-panel" aria-label="할 일 목록">
        <div class="panel-header">
          <h2>할 일 목록</h2>
          <button type="button" id="list-toggle" class="panel-toggle" aria-expanded="true" aria-controls="list-body" aria-label="할 일 목록 접기">
            <span id="list-toggle-label" aria-hidden="true">−</span>
          </button>
        </div>
        <div class="panel-body" id="list-body">
          <div class="panel-body-inner">
            <div class="panel-content">
              <section class="filters" aria-label="검색과 필터">
                <label class="visually-hidden" for="search-input">제목 검색</label>
                <input id="search-input" type="search" placeholder="제목 검색" autocomplete="off">
                <label class="visually-hidden" for="status-filter">상태 필터</label>
                <select id="status-filter">
                  <option value="">모든 상태</option>
                  <option value="TODO">할 일</option>
                  <option value="DOING">진행 중</option>
                  <option value="DONE">완료</option>
                </select>
                <label class="visually-hidden" for="priority-filter">우선순위 필터</label>
                <select id="priority-filter">
                  <option value="">모든 우선순위</option>
                  <option value="HIGH">높음</option>
                  <option value="NORMAL">보통</option>
                  <option value="LOW">낮음</option>
                </select>
                <label class="visually-hidden" for="sort-select">정렬</label>
                <select id="sort-select">
                  <option value="created">등록순</option>
                  <option value="due">마감일 임박순</option>
                  <option value="priority">우선순위순</option>
                </select>
              </section>
              <ul id="task-list"></ul>
              <p id="empty-message" class="empty">등록된 할 일이 없습니다.</p>
            </div>
          </div>
        </div>
      </section>
    </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
